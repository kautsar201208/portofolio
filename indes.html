<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portofolio</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar">
        <div class="navbar-logo">My Portfolio</div>
        <ul class="navbar-menu">
            <li><a href="#home">Home</a></li>
            <li><a href="#about">About</a></li>
            <li><a href="#portfolio">Portfolio</a></li>
            <li><a href="#contact">Contact</a></li>
        </ul>
    </nav>

    <!-- Section: Home -->
    <section id="home" class="home-section">
        <h1>Welcome to My Portfolio</h1>
        <p>Discover my work and projects.</p>
    </section>

    <!-- Section: About -->
    <section id="about" class="about-section">
        <h2>About Me</h2>
        <p>This is where you can write a brief introduction about yourself.</p>
    </section>

    <!-- Section: Portfolio -->
    <section id="portfolio" class="portfolio-section">
        <h2>My Works</h2>
        <div class="portfolio-gallery">
            <div class="portfolio-item">Project 1</div>
            <div class="portfolio-item">Project 2</div>
            <div class="portfolio-item">Project 3</div>
            <div class="portfolio-item">Project 4</div>
        </div>
    </section>

    <!-- Section: Contact -->
    <section id="contact" class="contact-section">
        <h2>Contact Me</h2>
        <p>Get in touch through email or social media.</p>
    </section>

</body>
</html>
